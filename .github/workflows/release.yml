name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check release version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build universal disk image
        run: make dist
      - name: Verify release artifacts
        run: tests/test_dist.sh
      - name: Read release notes
        run: |
          if test -s "docs/release-notes/v$VERSION.md"; then
            cp "docs/release-notes/v$VERSION.md" build/release-notes.md
            exit 0
          fi
          awk -v version="$VERSION" '
            /^## / {
              if (found) exit
              heading = $2
              gsub(/[][]/, "", heading)
              if (heading == version || heading == "v" version) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          if ! test -s build/release-notes.md; then
            printf 'USB Tether %s\n\nDownload the disk image and open USB Tether.pkg.\n' "$VERSION" > build/release-notes.md
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/USB-Tether-$VERSION.dmg" \
            "build/USB-Tether-$VERSION.dmg.sha256" \
            --verify-tag --title "USB Tether $VERSION" --notes-file build/release-notes.md
